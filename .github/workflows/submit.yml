name: Publish browser extension

on:
  workflow_dispatch:
    inputs:
      publish_chrome:
        description: Publish the verified package to Chrome Web Store
        type: boolean
        required: true
        default: true
      publish_firefox:
        description: Publish the verified package to Firefox Add-ons
        type: boolean
        required: true
        default: true
      publish_edge:
        description: Publish the verified package to Microsoft Edge Add-ons
        type: boolean
        required: true
        default: true
      edge_notes:
        description: Optional certification notes for Microsoft Edge reviewers
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-browser-extension
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.19.0"
  RELEASE_ARTIFACT: browser-extension-packages
  CHROME_ZIP: build/chrome-mv3-prod.zip
  EDGE_ZIP: build/edge-mv3-prod.zip
  FIREFOX_XPI: build/firefox-prod.zip
  FIREFOX_SOURCE_ZIP: dist/source_${{ github.sha }}.zip

jobs:
  build:
    name: Build and verify store packages
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test and typecheck
        run: pnpm test && pnpm typecheck

      - name: Build store packages
        run: pnpm package

      - name: Validate manifests and runtime bundles
        run: pnpm validate:builds

      - name: Package source for Firefox review
        run: |
          mkdir -p dist
          git archive --format=zip --output="${{ env.FIREFOX_SOURCE_ZIP }}" HEAD

      - name: Upload verified packages
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.RELEASE_ARTIFACT }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ env.CHROME_ZIP }}
            ${{ env.EDGE_ZIP }}
            ${{ env.FIREFOX_XPI }}
            build/firefox-prod/**
            ${{ env.FIREFOX_SOURCE_ZIP }}

  publish-chrome:
    name: Publish Chrome
    needs: build
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_chrome }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout publisher scripts
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download verified packages
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.RELEASE_ARTIFACT }}

      - name: Publish latest Chrome package
        env:
          SUBMIT_KEYS: ${{ secrets.SUBMIT_KEYS }}
        run: node scripts/publish-chrome.mjs

  publish-firefox:
    name: Publish Firefox
    needs: build
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_firefox }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout publisher scripts
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download verified packages
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.RELEASE_ARTIFACT }}

      - name: Publish Firefox package
        env:
          SUBMIT_KEYS: ${{ secrets.SUBMIT_KEYS }}
          FIREFOX_SOURCE_DIR: build/firefox-prod
        run: node scripts/publish-firefox.mjs

  publish-edge:
    name: Publish Edge
    needs: build
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_edge }}
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout publisher scripts
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download verified packages
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.RELEASE_ARTIFACT }}

      - name: Replace Edge draft and publish latest package
        env:
          SUBMIT_KEYS: ${{ secrets.SUBMIT_KEYS }}
          EDGE_NOTES: ${{ github.event.inputs.edge_notes }}
          EDGE_MAX_WAIT_MINUTES: "330"
          EDGE_RETRY_SECONDS: "30"
        run: node scripts/publish-edge.mjs
