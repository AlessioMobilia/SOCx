name: Publish browser extension

on:
  workflow_dispatch:
    inputs:
      edge_notes:
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      NODE_VERSION: "20"
      CHROME_ZIP: build/chrome-mv3-prod.zip
      EDGE_ZIP: build/edge-mv3-prod.zip
      FIREFOX_XPI: build/firefox-prod.zip
      FIREFOX_SOURCE_ZIP: dist/source_${{ github.sha }}.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build+zip Chrome
        run: pnpm run package:chrome

      - name: Build+zip Edge
        run: pnpm run package:edge

      - name: Build+zip Firefox
        run: pnpm run package:firefox

      - name: Typecheck and validate manifests
        run: pnpm run typecheck && pnpm run validate:builds

      - name: Package source for Firefox review
        run: |
          mkdir -p dist
          git archive --format=zip --output="${{ env.FIREFOX_SOURCE_ZIP }}" HEAD

      - name: Validate SUBMIT_KEYS JSON
        run: node -e 'JSON.parse(process.env.SUBMIT_KEYS); console.log("SUBMIT_KEYS OK")'
        env:
          SUBMIT_KEYS: ${{ secrets.SUBMIT_KEYS }}

      - name: Browser Platform Publisher
        uses: PlasmoHQ/bpp@v3.8.0
        with:
          keys: ${{ secrets.SUBMIT_KEYS }}
          chrome-file: ${{ env.CHROME_ZIP }}
          edge-file: ${{ env.EDGE_ZIP }}
          firefox-file: ${{ env.FIREFOX_XPI }}
          source-file: ${{ env.FIREFOX_SOURCE_ZIP }}
          edge-notes: ${{ github.event.inputs.edge_notes }}
          version-file: package.json
          verbose: true
